<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>角色編輯器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../common/style.css">
<link rel="stylesheet" href="./role.css">
</head>
<body>
<header>
    <button id="btnAssets" title="遊戲的 public/assets，或專案根目錄（改名／刪除時會多掃 xls/、src/）">選擇遊戲資料夾</button>
    <button id="btnReauth" hidden></button>
    <span id="assetsName" class="dim">（未選擇）</span>
    <span class="sep"></span>
    <button id="btnReload" title="從硬碟重新讀 role.json">重新讀取</button>
    <button id="btnSave" title="Ctrl+S">存檔</button>
    <span id="dirty" class="dirty" hidden>● 未存檔</span>
    <span class="sep"></span>
    <button id="btnUndo" title="Ctrl+Z">↶</button>
    <button id="btnRedo" title="Ctrl+Y">↷</button>
    <span class="sep"></span>
    <button id="btnForm" class="on">表單</button>
    <button id="btnTable">總覽</button>
    <span id="status" class="dim"></span>
</header>

<main>
    <aside id="left">
        <input id="search" placeholder="搜尋 id／名稱">
        <div id="list"></div>
        <button id="btnNew">＋ 新角色</button>
    </aside>
    <section id="view"></section>
</main>

<div id="datalists" hidden></div>

<dialog id="dlgAsk">
    <form method="dialog">
        <div class="title"></div>
        <div class="body"></div>
        <div class="row2 buttons"></div>
    </form>
</dialog>

<dialog id="dlgIcon">
    <form method="dialog">
        <div class="tabs"></div>
        <div class="body"></div>
        <div class="row2">
            <label>直接輸入（emoji、路徑） <input size="28"></label>
            <span class="info dim"></span>
            <span class="grow"></span>
            <button value="ok">確定</button><button value="cancel" formnovalidate>取消</button>
        </div>
    </form>
</dialog>

<script type="module" src="./main.js"></script>
</body>
</html>
