<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>遊戲工具</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./common/style.css">
<style>
    #tabs button { position: relative; }
    #tabs button.dirty::after { content: '●'; color: #fc8; margin-left: 4px; }
    #frames { flex: 1; position: relative; min-height: 0; }
    #frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<header>
    <span id="tabs">
        <button data-tab="item">道具</button>
        <button data-tab="role">角色</button>
        <button data-tab="ability">能力</button>
        <button data-tab="fx">特效</button>
        <button data-tab="story">任務</button>
        <button data-tab="dialog">對話</button>
        <button data-tab="local">文字</button>
        <button data-tab="lang">翻譯</button>
        <button data-tab="fit">試穿</button>
        <button data-tab="prompt">提示詞</button>
        <button data-tab="paperdoll">紙娃娃</button>
    </span>
    <span class="sep"></span>
    <button id="btnProject" title="選 game_02 專案根目錄（底下要有 public/assets）">選擇專案資料夾</button>
    <button id="btnReauth" hidden></button>
    <span id="projectName" class="dim">（未選擇）</span>
    <span class="sep"></span>
    <button id="btnTextures" title="textures/ 加了／刪了圖之後按，重新產生 textures.json（遊戲要重新整理才會載到）">更新圖片清單</button>
    <span id="status" class="dim"></span>
</header>
<div id="frames"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
