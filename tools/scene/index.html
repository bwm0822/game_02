<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>場景</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../common/style.css">
<link rel="stylesheet" href="../particle/pform.css">
<style>
    #left { width: 240px; }
    #left .row2 { display: flex; gap: 4px; align-items: center; font-size: 14px; }
    #left .sec { color: #aaa; font-weight: bold; font-size: 14px; }
    #list { flex: none; max-height: 30%; overflow: auto; }
    /* 放置面板（panel.js）：中欄右鍵空地 */
    .addpanel { position: fixed; z-index: 15; width: 320px; height: 360px; display: flex; flex-direction: column; background: #2b2d31; border: 1px solid #666; box-shadow: 0 4px 12px rgba(0,0,0,.5); font-size: 14px; }
    .addpanel .ptabs { flex: none; display: flex; flex-wrap: wrap; gap: 2px; padding: 4px 4px 0; border-bottom: 1px solid #444; }
    .addpanel .ptabs button { border-radius: 3px 3px 0 0; padding: 2px 7px; }
    .addpanel .ptabs button.on { background: #2f6db5; color: #fff; }
    .addpanel .phead { flex: none; display: flex; gap: 4px; padding: 4px; }
    .addpanel .phead .q { flex: 1; min-width: 0; }
    .addpanel .plist { flex: 1; min-height: 0; overflow: auto; padding: 0 4px 4px; }
    .addpanel .prow { cursor: pointer; }
    .addpanel .prow[draggable=true] { cursor: grab; }
    .addpanel .prow .id { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .addpanel .prow.last .id { color: #fc8; }
    .addpanel .pgroup { color: #aaa; font-size: 12px; font-weight: bold; margin: 6px 0 2px; }
    .addpanel .pcrumb { color: #aaa; font-size: 12px; margin: 2px 0 4px; }
    .addpanel .pcrumb a { cursor: pointer; color: #8bf; }
    .head .tw, .head .sec { cursor: pointer; user-select: none; }
    .head .tw { width: 16px; color: #aaa; font-size: 16px; }
    #tree { flex: 1; overflow: auto; border-top: 1px solid #333; padding-top: 6px; }
    #tree .item .eye { padding: 0 3px; font-size: 12px; line-height: 1.3; }
    #tree .item.hid .id, #tree .item.hid .lab { opacity: .45; }
    #tree .item .id { overflow: hidden; text-overflow: ellipsis; }
    #tree .row2 { margin-bottom: 2px; }
    #right .sec { color: #aaa; font-weight: bold; margin: 10px 0 4px; }
    #right .sec:first-child { margin-top: 0; }
    #right .head { margin: 10px 0 4px; border-top: 1px solid #3a3c40; padding-top: 6px; }
    #right .head:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
    #right .head .sec { margin: 0; }
    #right .head .draft { white-space: nowrap; }
    #right .head button { padding: 0 4px; font-size: 12px; line-height: 1.3; }
    #right .sec .dim { font-weight: normal; font-size: 12px; }
    #right table.props { border-collapse: collapse; }
    #right table.props td { padding: 2px 8px 2px 0; }
    #right td.k { color: #888; white-space: nowrap; }
    #right input.n { width: 56px; }
    #right select { max-width: 200px; }
    #right .acts { margin-top: 10px; }
    #right .row2 { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    #right button.on { background: #b5692f; color: #fff; }
    #right .hint { color: #fc8; font-size: 12px; margin-top: 4px; }
    #right .part { display: flex; gap: 4px; align-items: center; padding: 1px 4px; cursor: pointer; border-radius: 3px; }
    #right .part:hover { background: #333; }
    #right .part.off > .id, #right .part.off > .lab { opacity: .45; }
    #right .part .id { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #right .part .lab { color: #aaa; font-size: 12px; }
    #right .part button { padding: 0 4px; font-size: 12px; line-height: 1.3; }
    /* 左鍵選取（sandbox 可編輯）＝藍底；右鍵展開的列不標，靠下面的表單 */
    #right .part.picked, #right tr.picked > td { background: #2f6db5; color: #fff; }
    #right tr[data-box] { cursor: pointer; }
    #right .part > input[type=checkbox] { flex: none; margin: 0; }
    #right input.live { outline: 2px solid #ffd633; outline-offset: -1px; }
    #right .partform { margin: 2px 0 6px 12px; padding-left: 8px; border-left: 2px solid #2f6db5; }
    #right .partform.flat { margin: 0 0 6px; padding-left: 0; border-left: none; }
    #right .pform { margin-top: 6px; }
    #right .pform .prop > .k { min-width: 0; }
    #right .pform select { max-width: 100%; }    .warn { color: #f88; }
    .treebox { width: 420px; height: 280px; overflow: auto; border: 1px solid #444; margin: 6px 0; }
    /* 詢問框外框不捲：高度不夠時只縮 .treebox（自己捲），沒有 treebox 才讓 body 捲、按鈕照樣看得到 */
    #dlgAsk[open] { display: flex; flex-direction: column; max-height: calc(100vh - 40px); box-sizing: border-box; overflow: hidden; }
    #dlgAsk form { display: flex; flex-direction: column; flex: 0 1 auto; min-height: 0; }
    #dlgAsk form > * { flex: none; }
    #dlgAsk .body { flex: 0 1 auto; min-height: 0; max-height: none; display: flex; flex-direction: column; align-items: flex-start; }
    #dlgAsk .body:has(> .treebox) { overflow: hidden; }
    #dlgAsk .body > * { flex: none; }
    #dlgAsk .body > .treebox { flex: 0 1 auto; min-height: 80px; }
    .folders .fold { cursor: pointer; white-space: nowrap; padding: 1px 4px; }
    .folders .fold:hover { background: #333; }
    .folders .fold.sel { background: #2f6db5; color: #fff; }
    .folders .tw { display: inline-block; width: 14px; color: #888; }
    .folders .file.dim { color: #777; }
    /* 切前後片（cut.js）：左畫布、右設定 */
    #dlgCut[open] { display: flex; flex-direction: column; width: 92vw; height: 88vh; box-sizing: border-box; overflow: hidden; }
    #dlgCut .cutbody { flex: 1; min-height: 0; display: flex; gap: 8px; margin: 6px 0; }
    #dlgCut .cutview { flex: 1; min-width: 0; position: relative; border: 1px solid #444; }
    #dlgCut .cutcv { position: absolute; inset: 0; width: 100%; height: 100%; }
    #dlgCut .cutside { flex: none; width: 320px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
    #dlgCut .row2, #dlgCut .buttons { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    #dlgCut .hint { color: #fc8; font-size: 12px; }
    #dlgCut .cutmsg { color: #fc8; }
    #left #status { font-size: 14px; word-break: break-all; }
    #view { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 5px 8px; background: #25272b; border-bottom: 1px solid #111; font-size: 14px; }
    #bar .name { font-weight: bold; color: #ddd; }
    #bar label, #bar2 label { display: inline-flex; align-items: center; gap: 3px; }
    #bar select { max-width: 180px; }
    #bar2 { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 3px 8px 5px; background: #25272b; border-bottom: 1px solid #111; font-size: 14px; }
    #bar2 #rngTime { flex: 1; min-width: 160px; max-width: 480px; }
    #bar2 .time { font-family: monospace; min-width: 3em; }
    #bar2 input:disabled + .time, #bar2 #rngTime:disabled { opacity: .5; }
    #gamebox { flex: 1; min-height: 0; position: relative; background: #202226; }
    #game { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    #right { flex: none; width: 320px; box-sizing: border-box; overflow: auto; padding: 8px 10px; background: #25272b; border-left: 1px solid #111; font-size: 14px; }
    .ctxmenu { position: fixed; z-index: 20; display: flex; flex-direction: column; min-width: 140px; padding: 4px 0; background: #2b2d31; border: 1px solid #666; box-shadow: 0 4px 12px rgba(0,0,0,.5); }
    .ctxmenu button { border: 0; border-radius: 0; background: none; text-align: left; padding: 3px 12px; white-space: nowrap; }
    .ctxmenu button:hover:not(:disabled) { background: #2f6db5; }
    .ctxmenu button:disabled { color: #777; }
</style>
</head>
<body>
<main>
    <aside id="left">
        <div id="list"></div>
        <div id="tree" hidden></div>
        <div class="row2"><span class="grow"></span><button id="btnUndo" title="復原（Ctrl+Z，直接寫回 scenes.json）">↶</button><button id="btnRedo" title="重做（Ctrl+Y）">↷</button></div>
        <span id="status" class="dim"></span>
    </aside>
    <section id="view">
        <div id="bar">
            <span class="name" id="sceneName"></span>
            <label title="底圖（換了整個 sandbox 重開；只建地形＋靜態物件，不建角色）">底圖 <select id="selMap"></select></label>
            <label title="32×32 格線"><input type="checkbox" id="chkGrid"> 格線</label>
            <label title="選中的擺設／角色畫錨點（黃點）：擺設＝x/y、角色＝站的點（root 的位置）"><input type="checkbox" id="chkAnchor"> 錨點</label>
            <label title="畫光源的光色圓點（沒勾＝只畫選中的、其他點不到）"><input type="checkbox" id="chkLightIcon"> 光源記號</label>
            <label title="畫粒子發射點的橘色菱形（沒勾＝只畫選中的、其他點不到）"><input type="checkbox" id="chkParticleIcon"> 粒子記號</label>
            <button id="btnHome" title="整張地圖放進畫面">置中</button>
            <button id="btnReset" title="表演完的角色（走掉、倒地、被擊退）回到場景檔的樣子">重置</button>
            <button id="btnReload" title="重開 sandbox（role.json 等遊戲資料在別的分頁存檔時會自動重開）">重開</button>
            <span class="grow"></span>
            <span class="dim">左鍵選取／拖曳、空地右鍵放東西、滾輪縮放、中鍵平移</span>
        </div>
        <div id="bar2">
            <span title="遊戲時鐘：環境光照 GameScene 的 lutAmbient（整點換），燈跟著變亮變暗">🕒</span>
            <input type="range" id="rngTime" min="0" max="1439" step="1">
            <span id="lblTime" class="time"></span>
            <button id="btnPlay" title="播放：時間一直往前走（不寫檔；暫停時把那個時間存進場景）">▶</button>
            <select id="selSpeed" title="每秒走幾分鐘遊戲時間">
                <option value="10">×10</option><option value="60" selected>×60（1 小時／秒）</option><option value="240">×240</option>
            </select>
            <label title="勾了就不照時間，環境光固定這個顏色（試新的日夜數值用）"><input type="checkbox" id="chkAmb"> 自訂環境色</label>
            <input type="color" id="clrAmb" value="#666666">
        </div>
        <div id="gamebox"><iframe id="game" title="sandbox"></iframe></div>
    </section>
    <aside id="right" data-resize-right></aside>
</main>

<div id="datalists" hidden></div>

<dialog id="dlgAsk">
    <form method="dialog">
        <div class="title"></div>
        <div class="body"></div>
        <div class="row2 buttons"></div>
    </form>
</dialog>

<dialog id="dlgIcon">
    <form method="dialog">
        <div class="tabs"></div>
        <div class="body"></div>
        <div class="row2">
            <label>直接輸入 <input size="28"></label>
            <span class="info dim"></span>
            <span class="grow"></span>
            <button value="ok">確定</button><button value="cancel" formnovalidate>取消</button>
        </div>
    </form>
</dialog>

<script type="module" src="./main.js"></script>
</body>
</html>
