<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>地圖</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../common/style.css">
<style>
    #left { width: 260px; }
    #left .row2 { display: flex; gap: 4px; align-items: center; font-size: 14px; }
    #left .bottom { display: flex; flex-direction: column; gap: 4px; }
    #left #status { font-size: 14px; word-break: break-all; }
    .item .badges { margin-left: auto; display: flex; gap: 6px; color: #8bd; font-size: 13px; white-space: nowrap; }
    .item .badges .grp { color: #e9a; }
    .item.empty { opacity: .55; }
    #view { display: flex; flex-direction: column; min-width: 0; user-select: none; }
    /* 世界縮圖總覽 */
    .world { flex: none; position: relative; width: 100%; background: #111; border: 1px solid #333; }
    .world .cell { position: absolute; box-sizing: border-box; border: 1px solid rgba(255,255,255,.06); cursor: pointer; }
    .world .cell img { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
    .world .cell:hover { border-color: #8bd; z-index: 1; }
    .world .cell .lab { position: absolute; left: 2px; top: 1px; font-size: 11px; color: #ccc; text-shadow: 0 0 2px #000, 0 0 2px #000; }
    .world .cell .bd { position: absolute; right: 2px; bottom: 1px; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; font-size: 12px; }
    .world .cell .bd span { padding: 0 3px; border-radius: 3px; background: rgba(0,0,0,.75); color: #8bd; }
    .world .cell .bd span.grp { color: #e9a; }
    .world .cell.has { border-color: rgba(136,187,221,.6); }
    .wtitle { flex: none; color: #aaa; margin: 0 0 6px; font-size: 14px; }
    /* 地圖畫布 */
    .mv { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #25272b; border: 1px solid #333; border-radius: 4px; padding: 8px; }
    .mv .cvbox { flex: 1; min-height: 160px; position: relative; }
    .mv canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .mv .opts { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 6px; font-size: 14px; }
    .mv .opts:first-child { margin: 0 0 6px; }
    .mv .opts .name { font-weight: bold; color: #ddd; }
    .mv .opts input.zoom { width: 64px; }
    .mv .opts label { display: inline-flex; align-items: center; gap: 3px; }
    .mv .help { flex: none; width: 18px; height: 18px; line-height: 18px; text-align: center; border-radius: 50%; background: #3a3d44; color: #ccc; font-size: 12px; cursor: help; }
    .mv .tip { position: absolute; z-index: 2; pointer-events: none; max-width: min(320px, 90%); padding: 5px 10px; background: rgba(16,17,20,0.94); border: 1px solid #555; border-radius: 4px; font-size: 14px; line-height: 1.5; color: #ddd; }
    .mv .tip .tname { color: #fff; font-weight: bold; }
    .mv .tip .tsub { color: #9ab; }
    .mv .tip .thint { color: #999; }
    .mv .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .mv .msg[hidden] { display: none; }
    /* 右欄 */
    #right { flex: none; width: 320px; min-width: 260px; max-width: 50vw; overflow: auto; padding: 8px 10px; background: #25272b; border-left: 1px solid #111; display: flex; flex-direction: column; gap: 6px; }
    #right:empty { display: none; }
    #right .sec { color: #aaa; font-weight: bold; margin: 8px 0 2px; }
    #right .sec:first-child { margin-top: 0; }
    #right .sec .dim { font-weight: normal; }
    #right .layer { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 3px; }
    #right .layer .n { margin-left: auto; color: #888; font-size: 13px; }
    #right .layer .cond { display: block; color: #9ab; font-size: 13px; font-family: monospace; word-break: break-all; }
    #right .layer.grp b { color: #e9a; }
    #right .roles .r { display: flex; align-items: center; gap: 6px; padding: 1px 4px; border-radius: 3px; cursor: pointer; font-size: 14px; }
    #right .roles .r:hover { background: #33363c; }
    #right .roles .r.sel { background: #2f4a6b; }
    #right .roles .r .where { margin-left: auto; color: #888; font-size: 12px; }
    #right table { border-collapse: collapse; font-size: 14px; }
    #right td { padding: 1px 10px 1px 0; vertical-align: top; }
    #right td.k { color: #888; white-space: nowrap; }
    #right a.go { color: #8bd; cursor: pointer; }
</style>
</head>
<body>
<main>
    <aside id="left">
        <input id="search" placeholder="搜尋地圖名稱">
        <label class="row2"><input type="checkbox" id="onlyRoles"> 只看有角色／群組的</label>
        <div id="list"></div>
        <div class="bottom">
            <span id="status" class="dim"></span>
        </div>
    </aside>
    <section id="view" data-resize></section>
    <aside id="right"></aside>
</main>

<dialog id="dlgAsk">
    <form method="dialog">
        <div class="title"></div>
        <div class="body"></div>
        <div class="row2 buttons"></div>
    </form>
</dialog>

<script type="module" src="./main.js"></script>
</body>
</html>
