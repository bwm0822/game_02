<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>部位</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../common/style.css">
<style>
    /* 角色編輯器的預覽（role.css 其他規則會撞 .cell，只抄這段） */
    .pv { background: #25272b; border: 1px solid #333; border-radius: 4px; padding: 8px; }
    .pv canvas { display: block; image-rendering: pixelated; }
    .pv .opts { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; font-size: 14px; max-width: 300px; }
    .pv .opts label { display: inline-flex; align-items: center; gap: 3px; }
    .pv .opts input.bg { width: 32px; height: 22px; padding: 0 2px; }
    .pv .opts .bgchk { padding: 0 6px; font-size: 13px; }
    #left { width: 260px; }
    #filters { display: flex; gap: 4px; }
    #filters button { flex: 1; padding: 2px 4px; font-size: 14px; }
    #left .bottom { display: flex; flex-direction: column; gap: 4px; }
    #left #status { font-size: 14px; word-break: break-all; }
    .item .n { margin-left: auto; color: #888; font-size: 13px; }
    .item.unused { opacity: .45; }
    .item .warn { color: #e66; }
    .item .draft { color: #8bd; }
    #view .jsonmsg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 4px; }
    #view .jsonmsg .msg { color: #f88; user-select: text; }
    #view .je { margin-top: 24px; }
    #view { user-select: none; }
    .sec { color: #aaa; font-weight: bold; margin: 12px 0 4px; }
    .tabs + .sec { margin-top: 0; }
    .sec .dim { font-weight: normal; }
    .cells { display: flex; flex-wrap: wrap; gap: 6px; }
    .cell { position: relative; width: 104px; text-align: center; padding: 4px; border-radius: 3px; border: 1px solid transparent; font-size: 13px; cursor: pointer; }
    .cell:hover { background: #33363c; }
    .cell .ico { display: flex; margin: 0 auto 2px; }
    .cell .k { word-break: break-all; }
    .cell .n { position: absolute; top: 2px; right: 4px; color: #8bd; font-size: 12px; }
    .cell .sexmark { position: absolute; top: 2px; left: 4px; color: #e9a; font-size: 13px; }
    .cell.unused { opacity: .45; }
    .cell.bad { border-color: #e66; }
    .cell.bad .k { color: #f88; }
    #view .head { flex-wrap: wrap; }
    #view .acts { display: flex; flex-wrap: wrap; gap: 4px; }
    #view table { border-collapse: collapse; font-size: 15px; }
    #view td { padding: 1px 12px 1px 0; vertical-align: top; }
    #view td.k { color: #888; }
    #view .users { padding-left: 18px; margin: 4px 0; }
    #view a.go { color: #8bd; cursor: pointer; }
    #view table.numtab th { color: #888; font-weight: normal; text-align: left; padding-right: 6px; }
    #view table.numtab td { padding-right: 6px; }
    #view table.numtab input.num { width: 72px; }
    #view .sexnote { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    #left .row2 { display: flex; gap: 4px; }
    /* 只有畫布那層捲，選項列跟男女固定在下面 */
    #right { flex: none; min-width: 300px; max-width: 50vw; overflow: hidden; padding: 8px 10px; background: #25272b; border-left: 1px solid #111; display: flex; flex-direction: column; gap: 6px; }
    #right:empty { display: none; }
    #right .cap { flex: none; font-size: 13px; color: #888; }
    #right .pv { flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; }
    #right .pv .cvbox { flex: 0 1 auto; min-height: 0; overflow: auto; }
    #right .pv .opts { flex: none; }
    #right .sexsw { flex: none; display: flex; gap: 4px; }
</style>
</head>
<body>
<main>
    <aside id="left">
        <input id="search" placeholder="搜尋 id／sprite">
        <div id="filters"></div>
        <div id="list"></div>
        <div class="bottom">
            <div class="row2"><button id="btnNew" class="grow">＋ 新增</button><button id="btnUndo" title="復原擺放數字／JSON（Ctrl+Z，立刻存檔）">↶</button><button id="btnRedo" title="重做（Ctrl+Y）">↷</button></div>
            <span id="status" class="dim"></span>
        </div>
    </aside>
    <section id="view" data-resize></section>
    <aside id="right"></aside>
</main>

<dialog id="dlgAsk">
    <form method="dialog">
        <div class="title"></div>
        <div class="body"></div>
        <div class="row2 buttons"></div>
    </form>
</dialog>

<dialog id="dlgIcon">
    <form method="dialog">
        <div class="tabs"></div>
        <div class="body"></div>
        <div class="row2">
            <label>直接輸入 <input size="28"></label>
            <span class="info dim"></span>
            <span class="grow"></span>
            <button value="ok">確定</button><button value="cancel" formnovalidate>取消</button>
        </div>
    </form>
</dialog>

<script type="module" src="./main.js"></script>
</body>
</html>
