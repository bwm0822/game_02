    <span id="dirty" class="dirty" hidden>● 未存檔</span>
    <span class="sep"></span>
    <button id="btnUndo" title="Ctrl+Z">↶</button>

<main>
    <aside id="left"><div id="list"></div></aside>
    <section id="view"></section>
    <aside id="pv"></aside>
</main>

<dialog id="dlgAsk">

        <div class="title"></div>
        <div class="body"></div>
        <div class="row2 buttons"></div>
    </form>
</dialog>

<dialog id="dlgEquip"></dialog>

<script type="module" src="./main.js"></script>
