<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>對話編輯器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../common/style.css">
<link rel="stylesheet" href="../common/story.css">
</head>
<body>
<header>
    <button id="btnReload" title="從硬碟重新讀 dialog.json">重新讀取</button>
    <button id="btnSave" title="Ctrl+S">存檔</button>
    <span id="dirty" class="dirty" hidden>● 未存檔</span>
    <span class="sep"></span>
    <button id="btnUndo" title="Ctrl+Z">↶</button>
    <button id="btnRedo" title="Ctrl+Y">↷</button>
    <span class="sep"></span>
    <button id="btnForm" class="on">表單</button>
    <button id="btnTable">總覽</button>
    <span id="status" class="dim"></span>
</header>

<main>
    <aside id="left">
        <input id="search" placeholder="搜尋 NPC id／名稱">
        <div id="list"></div>
        <button id="btnNew">＋ NPC 對話</button>
    </aside>
    <section id="view"></section>
</main>
<footer id="checks"></footer>

<div id="datalists" hidden></div>

<dialog id="dlgAsk">
    <form method="dialog">
        <div class="title"></div>
        <div class="body"></div>
        <div class="row2 buttons"></div>
    </form>
</dialog>

<script type="module" src="./main.js"></script>
</body>
</html>
