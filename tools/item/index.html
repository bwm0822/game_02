<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>道具編輯器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../common/style.css">
<style>
    /* 第三欄預覽：只有畫布那層捲；總覽、沒選道具時藏起來 */
    #right { flex: none; min-width: 300px; max-width: 50vw; overflow: hidden; padding: 8px 10px; background: #25272b; border-left: 1px solid #111; display: flex; flex-direction: column; gap: 6px; }
    #right:empty { display: none; }
    #right .cap { flex: none; font-size: 13px; color: #888; }
    #right .pv { flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; background: #25272b; border: 1px solid #333; border-radius: 4px; padding: 8px; }
    #right .pv .cvbox { flex: 0 1 auto; min-height: 0; overflow: auto; }
    #right .pv canvas { display: block; image-rendering: pixelated; }
    #right .pv .opts { flex: none; display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; font-size: 14px; max-width: 300px; }
    #right .pv .opts label { display: inline-flex; align-items: center; gap: 3px; }
    #right .pv .opts input.bg { width: 32px; height: 22px; padding: 0 2px; }
    #right .pv .opts .bgchk { padding: 0 6px; font-size: 13px; }
    #right .sexsw { flex: none; display: flex; gap: 4px; }
</style>
</head>
<body>
<header>
    <button id="btnReload" title="從硬碟重新讀 item.json">重新讀取</button>
    <button id="btnSave" title="Ctrl+S">存檔</button>
    <span id="dirty" class="dirty" hidden>● 未存檔</span>
    <span class="sep"></span>
    <button id="btnUndo" title="Ctrl+Z">↶</button>
    <button id="btnRedo" title="Ctrl+Y">↷</button>
    <span class="sep"></span>
    <button id="btnForm" class="on">表單</button>
    <button id="btnTable">總覽</button>
    <span id="status" class="dim"></span>
</header>

<main>
    <aside id="left">
        <input id="search" placeholder="搜尋 id／名稱">
        <div id="list"></div>
        <button id="btnNew">＋ 新道具</button>
    </aside>
    <section id="view" data-resize></section>
    <aside id="right"></aside>
</main>

<div id="datalists" hidden></div>

<dialog id="dlgAsk">
    <form method="dialog">
        <div class="title"></div>
        <div class="body"></div>
        <div class="row2 buttons"></div>
    </form>
</dialog>

<dialog id="dlgIcon">
    <form method="dialog">
        <div class="tabs"></div>
        <div class="body"></div>
        <div class="row2">
            <label>直接輸入（emoji、路徑） <input size="28"></label>
            <span class="info dim"></span>
            <span class="grow"></span>
            <button value="ok">確定</button><button value="cancel" formnovalidate>取消</button>
        </div>
    </form>
</dialog>

<script type="module" src="./main.js"></script>
</body>
</html>
