<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>能力編輯器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../common/style.css">
<link rel="stylesheet" href="./ability.css">
</head>
<body>
<header>
    <button id="btnReload" title="從硬碟重新讀 ability.json、ab_tree.json、local.json">重新讀取</button>
    <button id="btnSave" title="Ctrl+S">存檔</button>
    <span id="dirty" class="dirty" hidden>● 未存檔</span>
    <span class="sep"></span>
    <button id="btnUndo" title="Ctrl+Z">↶</button>
    <button id="btnRedo" title="Ctrl+Y">↷</button>
    <span id="status" class="dim"></span>
</header>

<main>
    <aside id="left">
        <input id="search" placeholder="搜尋技能 id／名稱">
        <div id="list"></div>
    </aside>
    <section id="view"></section>
    <aside id="pv"></aside>
</main>

<div id="datalists" hidden></div>

<dialog id="dlgAsk">
    <form method="dialog">
        <div class="title"></div>
        <div class="body"></div>
        <div class="row2 buttons"></div>
    </form>
</dialog>

<dialog id="dlgIcon">
    <form method="dialog">
        <div class="tabs"></div>
        <div class="body"></div>
        <div class="row2">
            <label>直接輸入（emoji、路徑） <input size="28"></label>
            <span class="info dim"></span>
            <span class="grow"></span>
            <button value="ok">確定</button><button value="cancel" formnovalidate>取消</button>
        </div>
    </form>
</dialog>

<script type="module" src="./main.js"></script>
</body>
</html>
